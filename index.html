  <body class="min-h-screen">
    <script>
      const SUPABASE_URL = "https://ksjvpuyiuplaonpbwrfn.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzanZwdXlpdXBsYW9ucGJ3cmZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxMDgyNDEsImV4cCI6MjA5OTY4NDI0MX0._Wp1Ty4KBFJORjmI41S5eFfVulZJyhMr0ODGykn49uM";
      const supa = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
      );
    </script>

    <div id="app" class="min-h-screen"></div>

    <script>
      const app = document.getElementById("app");
      let currentUser = null;
      let currentProfile = null;
      let recoveryMode = false;
      let currentTabKey = null;
      // Crește la fiecare schimbare de tab. Funcțiile de randare asincrone
      // își rețin propria valoare la intrare și, după fetch-uri, verifică
      // dacă mai sunt "cele mai recente" înainte să scrie în DOM — altfel
      // un răspuns întârziat de la un tab părăsit ar putea scrie peste
      // conținutul tab-ului nou (sau ar da eroare pe elemente inexistente).
      let renderGen = 0;
      function isStaleRender(myGen) {
        return myGen !== renderGen;
      }
      const tabSearchTerms = {};
      let searchDebounceTimer = null;

      // ---------------------------------------------------------------
      // Cache simplu în memorie pentru tabele mici / rar modificate.
      // Elimină re-descărcarea completă a acestor tabele la fiecare
      // schimbare de tab (profiles, agent_magazine, hub_magazine).
      // Se invalidează explicit după orice scriere (insert/update/delete)
      // care le poate afecta — vezi invalidateCache().
      // ---------------------------------------------------------------
      const CACHE_TTL_MS = 30000; // plasă de siguranță; invalidarea explicită e principalul mecanism
      const _cache = {
        profiles: { data: null, ts: 0, pending: null },
        agent_magazine: { data: null, ts: 0, pending: null },
        hub_magazine: { data: null, ts: 0, pending: null },
      };

      async function getCached(table) {
        const entry = _cache[table];
        const fresh = entry.data && Date.now() - entry.ts < CACHE_TTL_MS;
        if (fresh) return { data: entry.data, error: null };
        if (entry.pending) return entry.pending;
        entry.pending = supa
          .from(table)
          .select("*")
          .then((res) => {
            if (!res.error) {
              entry.data = res.data;
              entry.ts = Date.now();
            }
            entry.pending = null;
            return res;
          });
        return entry.pending;
      }

      function invalidateCache(...tables) {
        tables.forEach((t) => {
          if (_cache[t]) {
            _cache[t].data = null;
            _cache[t].ts = 0;
          }
        });
      }

      // ---------------------------------------------------------------
      // Paginare server-side reutilizabilă pentru listele mari (produse,
      // comenzi, vânzări) care altfel ar încărca tabelul întreg. Fiecare
      // listă paginată își ține propria pagină curentă, cheia fiind
      // tab-ul curent (currentTabKey), ca la revenirea pe tab să rămână
      // pe aceeași pagină.
      // ---------------------------------------------------------------
      const PAGE_SIZE = 50;
      const _pageState = {};

      function getPageState(key) {
        if (!_pageState[key]) _pageState[key] = { page: 0 };
        return _pageState[key];
      }

      function resetPage(key) {
        getPageState(key).page = 0;
      }

      function rangeFor(key) {
        const st = getPageState(key);
        const from = st.page * PAGE_SIZE;
        return { from, to: from + PAGE_SIZE - 1 };
      }

      function paginationBarHtml(key, totalCount) {
        const st = getPageState(key);
        const totalPages = Math.max(
          1,
          Math.ceil((totalCount || 0) / PAGE_SIZE),
        );
        if (st.page > totalPages - 1) st.page = Math.max(0, totalPages - 1);
        const cur = st.page + 1;
        return `<div class="flex items-center justify-between text-xs text-slate-500 mt-3 pt-2 border-t shrink-0" style="border-color:var(--line)" data-pag-key="${key}">
          <span>Pagina ${cur} din ${totalPages} · ${totalCount || 0} rezultate</span>
          <div class="flex gap-1">
            <button type="button" data-pag="prev" class="border rounded-md px-2.5 py-1 text-xs font-medium ${cur <= 1 ? "opacity-40 pointer-events-none" : "hover:bg-slate-50"}" style="border-color:var(--line)">‹ Anterioară</button>
            <button type="button" data-pag="next" class="border rounded-md px-2.5 py-1 text-xs font-medium ${cur >= totalPages ? "opacity-40 pointer-events-none" : "hover:bg-slate-50"}" style="border-color:var(--line)">Următoare ›</button>
          </div>
        </div>`;
      }

      function bindPaginationBar(container, key, onChange) {
        const bar = container.querySelector(
          `[data-pag-key="${CSS.escape(key)}"]`,
        );
        if (!bar) return;
        const st = getPageState(key);
        bar
          .querySelector('[data-pag="prev"]')
          ?.addEventListener("click", () => {
            st.page = Math.max(0, st.page - 1);
            onChange();
          });
        bar
          .querySelector('[data-pag="next"]')
          ?.addEventListener("click", () => {
            st.page = st.page + 1;
            onChange();
          });
      }

      function buildSearchOrFilter(term, columns) {
        const t = (term || "").trim();
        if (!t) return null;

        const curatat = t.replace(/[(),]/g, " ").trim();
        if (!curatat) return null;
        const escapat = curatat.replace(/[%_]/g, (m) => "\\" + m);
        return columns.map((c) => `${c}.ilike.%${escapat}%`).join(",");
      }

      function esc(str) {
        if (str === null || str === undefined) return "";
        return String(str).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function toast(msg, isError = false) {
        const el = document.createElement("div");
        el.className = `fixed bottom-5 right-5 z-50 px-4 py-3 rounded-lg shadow-lg text-sm font-medium fade-in ${isError ? "bg-red-600 text-white" : "bg-[var(--graphite)] text-white"}`;
        el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3500);
      }
      function rolePill(role) {
        const map = {
          magazin: ["Magazin", "role-magazin"],
          agent: ["Agent", "role-agent"],
          admin: ["Admin", "role-admin"],
          superadmin: ["Super Admin", "role-superadmin"],
          magazin_hub: ["Magazin-HUB", "role-magazin-hub"],
        };
        const [label, cls] = map[role] || ["Fără rol", "role-none"];
        return `<span class="role-pill ${cls}">${label}</span>`;
      }

      supa.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY") {
          recoveryMode = true;
          renderResetPassword();
          return;
        }
        if (event === "SIGNED_OUT") {
          currentUser = null;
          currentProfile = null;
          renderAuthScreen();
          return;
        }
        if (session && !recoveryMode) {
          const esteAcelasiUtilizator =
            currentUser && currentUser.id === session.user.id;
          currentUser = session.user;
          // Supabase re-emite un eveniment de sesiune (ex. la refresh de
          // token sau la revenirea pe tab-ul browserului) fără să fie o
          // autentificare nouă. Dacă reconstruim tot ecranul de fiecare
          // dată (loadProfileAndRender -> renderShell -> app.innerHTML),
          // orice fetch aflat în desfășurare pe tab-ul curent rămâne cu
          // elementele DOM țintă șterse și pică la runda de randare.
          if (esteAcelasiUtilizator && currentProfile) return;
          loadProfileAndRender();
        }
      });

      (async function init() {
        const tokenHash = new URLSearchParams(window.location.search).get(
          "token_hash",
        );
        const otpType = new URLSearchParams(window.location.search).get("type");
        if (tokenHash && otpType) {
          renderConfirmScreen(tokenHash, otpType);
          return;
        }
        const {
          data: { session },
        } = await supa.auth.getSession();
        if (session) {
          currentUser = session.user;
          await loadProfileAndRender();
        } else {
          renderAuthScreen();
        }
      })();

      function renderConfirmScreen(tokenHash, type) {
        const isRecovery = type === "recovery";
        app.innerHTML = `
  <div class="min-h-screen flex items-center justify-center px-4" style="background:radial-gradient(circle at 20% 20%, #1B2430 0%, #0E1318 65%);">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-2xl shadow-xl p-6 fade-in text-center">
        <h2 class="text-lg font-bold mb-2">${isRecovery ? "Resetare parolă" : "Confirmare cont"}</h2>
        <p class="text-sm text-slate-500 mb-5">${isRecovery ? "Apasă butonul de mai jos pentru a continua resetarea parolei." : "Apasă butonul de mai jos pentru a-ți confirma adresa de email."}</p>
        <button id="btn-confirm-otp" class="w-full btn-primary rounded-lg py-2.5 text-sm">${isRecovery ? "Continuă" : "Confirmă contul"}</button>
        <p id="confirm-msg" class="text-sm text-center mt-3"></p>
      </div>
    </div>
  </div>`;

        document
          .getElementById("btn-confirm-otp")
          .addEventListener("click", async () => {
            const btn = document.getElementById("btn-confirm-otp");
            const msg = document.getElementById("confirm-msg");
            btn.disabled = true;
            btn.textContent = "Se verifică...";

            const { error } = await supa.auth.verifyOtp({
              token_hash: tokenHash,
              type,
            });

            window.history.replaceState(
              {},
              document.title,
              window.location.pathname,
            );

            if (error) {
              msg.className = "text-sm text-center text-red-600 mt-3";
              msg.textContent = "Linkul nu mai este valid. Cere un link nou.";
              btn.disabled = false;
              btn.textContent = isRecovery ? "Continuă" : "Confirmă contul";
              return;
            }

            if (isRecovery) {
              recoveryMode = true;
              renderResetPassword();
            } else {
              await supa.auth.signOut();
              renderAuthScreen("login");
              toast("Cont confirmat cu succes. Te poți autentifica.");
            }
          });
      }

      async function loadProfileAndRender() {
        const { data, error } = await supa
          .from("profiles")
          .select("*")
          .eq("id", currentUser.id)
          .single();
        if (error) {
          toast("Eroare la încărcarea profilului: " + error.message, true);
        }
        currentProfile = data || null;
        renderShell();
      }

      function renderAuthScreen(mode = "login") {
        app.innerHTML = `
  <div class="min-h-screen flex items-center justify-center px-4" style="background:radial-gradient(circle at 20% 20%, #1B2430 0%, #0E1318 65%);">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <img src="./assets/logo.png" alt="Geeli Distribution" style="width:80%;height:auto;display:block;margin:0 auto;" />
      </div>

      <div class="bg-white rounded-2xl shadow-xl p-6 fade-in">
        <div class="flex text-sm font-semibold mb-6 border-b" style="border-color:var(--line)">
          <button data-tab="login" class="auth-tab px-3 py-2 -mb-px ${mode === "login" ? "tab-active" : "tab-inactive"}">Autentificare</button>
          <button data-tab="signup" class="auth-tab px-3 py-2 -mb-px ${mode === "signup" ? "tab-active" : "tab-inactive"}">Cont nou</button>
          <button data-tab="forgot" class="auth-tab px-3 py-2 -mb-px ${mode === "forgot" ? "tab-active" : "tab-inactive"}">Am uitat parola</button>
        </div>
        <div id="auth-panel"></div>
      </div>
      <p class="text-center text-slate-500 text-xs mt-6">© ${new Date().getFullYear()} Geeli Distribution</p>
    </div>
  </div>`;

        document.querySelectorAll(".auth-tab").forEach((btn) => {
          btn.addEventListener("click", () =>
            renderAuthScreen(btn.dataset.tab),
          );
        });

        const panel = document.getElementById("auth-panel");
        if (mode === "login") panel.innerHTML = loginForm();
        if (mode === "signup") panel.innerHTML = signupForm();
        if (mode === "forgot") panel.innerHTML = forgotForm();

        if (mode === "login") bindLoginForm();
        if (mode === "signup") bindSignupForm();
        if (mode === "forgot") bindForgotForm();
      }

      function fieldLabel(txt) {
        return `<label class="block text-sm font-medium text-slate-700 mb-1">${txt}</label>`;
      }
      function inputBase() {
        return "w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--teal)] focus:border-transparent";
      }
      function produsFieldLabel(txt) {
        return `<label class="block text-[11px] font-medium text-slate-600 mb-0.5">${txt}</label>`;
      }
      function produsInputBase() {
        return "w-full border rounded-md px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-[var(--teal)] focus:border-transparent";
      }

      function loginForm() {
        return `
  <form id="form-login" class="space-y-4">
    <div>${fieldLabel("Email")}<input type="email" id="login-email" required class="${inputBase()}" placeholder="nume@exemplu.ro"></div>
    <div>${fieldLabel("Parolă")}<input type="password" id="login-pass" required class="${inputBase()}" placeholder="••••••••"></div>
    <button type="submit" class="w-full btn-primary rounded-lg py-2.5 text-sm">Autentificare</button>
    <p id="login-msg" class="text-sm text-center"></p>
  </form>`;
      }
      function bindLoginForm() {
        document
          .getElementById("form-login")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector("button");
            btn.disabled = true;
            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-pass").value;
            const { error } = await supa.auth.signInWithPassword({
              email,
              password,
            });
            btn.disabled = false;
            const msg = document.getElementById("login-msg");
            if (error) {
              msg.className = "text-sm text-center text-red-600";
              msg.textContent = error.message.includes("Invalid login")
                ? "Email sau parolă incorectă."
                : error.message;
            }
          });
      }

      function signupForm() {
        return `
  <form id="form-signup" class="space-y-4">
    <div>${fieldLabel("Email")}<input type="email" id="signup-email" required class="${inputBase()}" placeholder="nume@exemplu.ro"></div>
    <div>${fieldLabel("Parolă")}<input type="password" id="signup-pass" required minlength="6" class="${inputBase()}" placeholder="Minim 6 caractere"></div>
    <div>${fieldLabel("Confirmă parola")}<input type="password" id="signup-pass2" required minlength="6" class="${inputBase()}"></div>
    <button type="submit" class="w-full btn-primary rounded-lg py-2.5 text-sm">Creează cont</button>
    <p id="signup-msg" class="text-sm text-center"></p>
    <p class="text-xs text-slate-500 text-center">Contul nou nu are niciun rol alocat. Un administrator va activa contul și îi va atribui rolul.</p>
  </form>`;
      }
      function bindSignupForm() {
        document
          .getElementById("form-signup")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector("button");
            const msg = document.getElementById("signup-msg");
            const email = document.getElementById("signup-email").value.trim();
            const pass = document.getElementById("signup-pass").value;
            const pass2 = document.getElementById("signup-pass2").value;
            if (pass !== pass2) {
              msg.className = "text-sm text-center text-red-600";
              msg.textContent = "Parolele nu coincid.";
              return;
            }
            btn.disabled = true;
            const { error } = await supa.auth.signUp({
              email,
              password: pass,
              options: {
                emailRedirectTo:
                  window.location.origin + window.location.pathname,
              },
            });
            btn.disabled = false;
            if (error) {
              msg.className = "text-sm text-center text-red-600";
              msg.textContent = error.message;
            } else {
              msg.className = "text-sm text-center text-emerald-600";
              msg.textContent =
                "Cont creat. Verifică emailul pentru confirmare (dacă este activată), apoi autentifică-te.";
              e.target.reset();
            }
          });
      }

      function forgotForm() {
        return `
  <form id="form-forgot" class="space-y-4">
    <p class="text-sm text-slate-500">Introdu adresa de email folosită la înregistrare. Vei primi un link de resetare a parolei.</p>
    <div>${fieldLabel("Email")}<input type="email" id="forgot-email" required class="${inputBase()}" placeholder="nume@exemplu.ro"></div>
    <button type="submit" class="w-full btn-primary rounded-lg py-2.5 text-sm">Trimite link de resetare</button>
    <p id="forgot-msg" class="text-sm text-center"></p>
  </form>`;
      }
      function bindForgotForm() {
        document
          .getElementById("form-forgot")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector("button");
            const msg = document.getElementById("forgot-msg");
            const email = document.getElementById("forgot-email").value.trim();
            btn.disabled = true;
            const { error } = await supa.auth.resetPasswordForEmail(email, {
              redirectTo: window.location.origin + window.location.pathname,
            });
            btn.disabled = false;
            if (error) {
              msg.className = "text-sm text-center text-red-600";
              msg.textContent = error.message;
            } else {
              msg.className = "text-sm text-center text-emerald-600";
              msg.textContent =
                "Dacă adresa există, un email cu linkul de resetare a fost trimis.";
            }
          });
      }

      function renderResetPassword() {
        app.innerHTML = `
  <div class="min-h-screen flex items-center justify-center px-4" style="background:radial-gradient(circle at 20% 20%, #1B2430 0%, #0E1318 65%);">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-2xl shadow-xl p-6 fade-in">
        <h2 class="text-lg font-bold mb-1">Modificare parolă</h2>
        <p class="text-sm text-slate-500 mb-5">Alege o parolă nouă pentru contul tău.</p>
        <form id="form-reset" class="space-y-4">
          <div>${fieldLabel("Parolă nouă")}<input type="password" id="reset-pass" required minlength="6" class="${inputBase()}"></div>
          <div>${fieldLabel("Confirmă parola nouă")}<input type="password" id="reset-pass2" required minlength="6" class="${inputBase()}"></div>
          <button type="submit" class="w-full btn-primary rounded-lg py-2.5 text-sm">Salvează parola nouă</button>
          <p id="reset-msg" class="text-sm text-center"></p>
        </form>
      </div>
    </div>
  </div>`;

        document
          .getElementById("form-reset")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const msg = document.getElementById("reset-msg");
            const p1 = document.getElementById("reset-pass").value;
            const p2 = document.getElementById("reset-pass2").value;
            if (p1 !== p2) {
              msg.className = "text-sm text-center text-red-600";
              msg.textContent = "Parolele nu coincid.";
              return;
            }
            const { error } = await supa.auth.updateUser({ password: p1 });
            if (error) {
              msg.className = "text-sm text-center text-red-600";
              msg.textContent = error.message;
            } else {
              msg.className = "text-sm text-center text-emerald-600";
              msg.textContent = "Parola a fost schimbată. Redirecționare...";
              recoveryMode = false;
              setTimeout(async () => {
                const {
                  data: { session },
                } = await supa.auth.getSession();
                if (session) {
                  currentUser = session.user;
                  await loadProfileAndRender();
                } else renderAuthScreen();
              }, 1200);
            }
          });
      }

      function renderShell() {
        if (!currentProfile) {
          renderPendingRole();
          return;
        }
        if (!currentProfile.role) {
          renderPendingRole();
          return;
        }

        const tabs = tabsForRole(currentProfile.role);

        app.innerHTML = `
  <div class="min-h-screen md:flex">
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-20 hidden"></div>
    <aside id="app-sidebar" class="w-64 md:w-60 shrink-0 text-white flex flex-col fixed md:static inset-y-0 left-0 z-30 -translate-x-full md:translate-x-0 transition-transform duration-200 ease-out" style="background:var(--graphite)">
      <div class="py-4 flex flex-col items-center border-b border-white/10 relative">
        <button id="btn-close-sidebar" class="absolute right-2 top-2 shrink-0 md:hidden text-slate-400 hover:text-white text-xl leading-none px-1">✕</button>
        <img src="./assets/logo.png" alt="Geeli Distribution" style="width:80%;height:auto;display:block;" />
      </div>
      <nav id="side-nav" class="flex-1 px-3 py-4 space-y-1 overflow-y-auto"></nav>
      <div class="px-4 py-4 border-t border-white/10">
        <div class="text-xs text-slate-400 mb-0.5">${esc(currentProfile.email)}</div>
        <div class="mb-3 flex items-center gap-1.5 flex-wrap">
          ${rolePill(currentProfile.role)}
          ${
            currentProfile.role === "magazin"
              ? currentProfile.nume
                ? `<span class="text-xs text-slate-300">${esc(currentProfile.nume)}${currentProfile.filiala ? " - " + esc(currentProfile.filiala) : ""}</span>`
                : ""
              : currentProfile.nume
                ? `<span class="text-xs text-slate-300">${esc(currentProfile.nume)}</span>`
                : ""
          }
        </div>
        <div class="flex items-center gap-2 flex-wrap">
          <button id="btn-change-pass" class="text-xs text-slate-300 hover:text-white underline">Schimbă parola</button>
          <span class="text-slate-600 text-xs">·</span>
          <button id="btn-logout" class="text-xs text-slate-300 hover:text-white underline">Deconectare</button>
        </div>
      </div>
    </aside>
    <main class="flex-1 min-w-0">
      <header class="bg-white border-b px-4 md:px-6 py-4" style="border-color:var(--line)">
        <div class="flex items-center gap-3">
          <button id="btn-open-sidebar" class="md:hidden text-slate-600 hover:text-slate-900 text-xl leading-none px-1" aria-label="Deschide meniul">☰</button>
          <h1 id="page-title" class="text-base md:text-lg font-bold text-slate-800"></h1>

      function generateProductId() {
        const d = new Date();
        const zz = String(d.getDate()).padStart(2, "0");
        const ll = String(d.getMonth() + 1).padStart(2, "0");
        const aa = String(d.getFullYear()).slice(-2);

      function fmtNum(n) {

      function distinctMarci(produse) {
        const set = new Set();
        (produse || []).forEach((p) => {
          if (p.marca) set.add(p.marca);
        });
        return Array.from(set).sort((a, b) => a.localeCompare(b, "ro"));
      }

      function buildMarcaCategorieMap(produse) {
        const counts = {};
        (produse || []).forEach((p) => {
          if (!p.marca || !p.categorie) return;
          const key = p.marca.trim().toLowerCase();
          counts[key] = counts[key] || {};
          counts[key][p.categorie] = (counts[key][p.categorie] || 0) + 1;
        });
        const map = {};
        Object.keys(counts).forEach((key) => {
          let best = null;
          let bestCount = -1;
          Object.entries(counts[key]).forEach(([categorie, n]) => {
            if (n > bestCount) {
              best = categorie;
              bestCount = n;
            }
          });
          map[key] = best;
        });
        return map;
      }

        function renderMatches() {
          const q = inputEl.value.trim().toLowerCase();
          if (!q) {
            listEl.classList.add("hidden");
            listEl.innerHTML = "";
            return;
          }
          const matches = names
            .filter((n) => n.toLowerCase().includes(q))
            .slice(0, 8);
          if (!matches.length) {
            listEl.classList.add("hidden");
            listEl.innerHTML = "";
            return;
          }
          listEl.innerHTML = matches
            .map(
              (n) =>
                `<div class="agent-suggestion px-3 py-1.5 hover:bg-slate-100 cursor-pointer">${esc(n)}</div>`,
            )
            .join("");
          listEl.classList.remove("hidden");
          listEl.querySelectorAll(".agent-suggestion").forEach((el, i) => {
            el.addEventListener("mousedown", (e) => {
              e.preventDefault();
              inputEl.value = matches[i];
              listEl.classList.add("hidden");
              listEl.innerHTML = "";
              if (onChange) onChange(inputEl.value);
            });
          });
        }
        inputEl.addEventListener("input", renderMatches);
        inputEl.addEventListener("focus", renderMatches);
        inputEl.addEventListener("blur", () => {
          setTimeout(() => {
            listEl.classList.add("hidden");
          }, 150);
          if (onChange) onChange(inputEl.value);
        });
      }

      function attachMagazinAutocomplete(
        inputEl,
        listEl,
        hiddenIdEl,
        magazine,
        onSelect,
      ) {
        const items = magazine.map((m) => ({
          id: m.id,
          label: `${m.nume || m.email}${m.filiala ? " - " + m.filiala : ""}`,
        }));
        function clearIdIfMismatch() {
          const match = items.find((it) => it.label === inputEl.value);
          if (!match) {
            hiddenIdEl.value = "";
            if (onSelect) onSelect(null);
          }
        }
        function renderMatches() {
          const q = inputEl.value.trim().toLowerCase();
          if (!q) {
            listEl.classList.add("hidden");
            listEl.innerHTML = "";
            return;
          }
          const matches = items
            .filter((it) => it.label.toLowerCase().includes(q))
            .slice(0, 8);
          if (!matches.length) {
            listEl.classList.add("hidden");
            listEl.innerHTML = "";
            return;
          }
          listEl.innerHTML = matches
            .map(
              (it) =>
                `<div class="magazin-suggestion px-3 py-1.5 hover:bg-slate-100 cursor-pointer">${esc(it.label)}</div>`,
            )
            .join("");
          listEl.classList.remove("hidden");
          listEl.querySelectorAll(".magazin-suggestion").forEach((el, i) => {
            el.addEventListener("mousedown", (e) => {
              e.preventDefault();
              inputEl.value = matches[i].label;
              hiddenIdEl.value = matches[i].id;
              listEl.classList.add("hidden");
              listEl.innerHTML = "";
              if (onSelect)
                onSelect(magazine.find((m) => m.id === matches[i].id));
            });
          });
        }
        inputEl.addEventListener("input", () => {
          clearIdIfMismatch();
          renderMatches();
        });
        inputEl.addEventListener("focus", renderMatches);
        inputEl.addEventListener("blur", () => {
          setTimeout(() => {
            listEl.classList.add("hidden");
          }, 150);
        });
      }

      function attachPriceAutoCalc({
        intrareInput,
        vanzareInput,
        adaosInput,
        alteInput,
        totalInput,
        tvaInput,
        discountInput,
        discountTipInput,
      }) {
        function updateTotalTva() {
          const vanzareStr = vanzareInput.value.trim();
          if (vanzareStr === "") {
            totalInput.value = "";
            tvaInput.value = "";
            return;
          }
          const vanzare = parseFloat(vanzareStr) || 0;
          const alte = parseFloat(alteInput.value) || 0;
          const discount = discountInput
            ? parseFloat(discountInput.value) || 0
            : 0;

          const discountTip = discountTipInput
            ? discountTipInput.value
            : "procent";
          const totalBrut = vanzare + alte;
          const total =
            discountTip === "suma"
              ? totalBrut - discount
              : totalBrut * (1 - discount / 100);
          totalInput.value = fmtNum(total);
          tvaInput.value = fmtNum(total * (1 + TVA_RATE));
        }
        adaosInput.addEventListener("input", () => {
          const adaosStr = adaosInput.value.trim();
          if (adaosStr !== "") {
            const intrare = parseFloat(intrareInput.value) || 0;
            const adaos = parseFloat(adaosStr) || 0;
            vanzareInput.value = (intrare + adaos).toFixed(2);
          }
          updateTotalTva();
        });
        vanzareInput.addEventListener("input", () => {
          const vanzareStr = vanzareInput.value.trim();
          if (vanzareStr !== "") {
            const intrare = parseFloat(intrareInput.value) || 0;
            const vanzare = parseFloat(vanzareStr) || 0;
            adaosInput.value = (vanzare - intrare).toFixed(2);
          }
          updateTotalTva();
        });
        alteInput.addEventListener("input", updateTotalTva);
        if (discountInput)
          discountInput.addEventListener("input", updateTotalTva);
        return { updateTotalTva };
      }

      function buildAgentMagazinMap(asocieri, agenti) {
        const map = new Map();
        (asocieri || []).forEach((a) => {
          if (map.has(a.magazin_id)) return;
          const ag = agenti.find((x) => x.id === a.agent_id);
          if (ag) map.set(a.magazin_id, ag.nume || ag.email);
        });
        return map;
      }

      function buildProdusComandaMap(linii, comenzi) {
        const comenziMap = new Map((comenzi || []).map((c) => [c.id, c]));
        const map = new Map();
        (linii || []).forEach((l) => {
          if (
            l.status_linie === "trimis" &&
            l.produs_id &&
            comenziMap.has(l.comanda_id)
          ) {
            map.set(l.produs_id, comenziMap.get(l.comanda_id));
          }
        });
        return map;
      }

      // Stoc central: doar produsele nealocate unui magazin/vânzare directă.
      // comanda_produse e interogat DOAR pentru id-urile produselor din
      // pagina curentă (nu tot tabelul) — folosit doar ca să marcheze
      // produsele deja "asignate" unei comenzi (rezervate).
      async function loadStocCentralData(pageKey) {
        const termenCautare = tabSearchTerms[currentTabKey] || "";
        const { from, to } = rangeFor(pageKey);
        let produseQuery = supa
          .from("produse")
          .select("*", { count: "exact" })
          .is("magazin_id", null)
          .eq("vanzare_directa", false)
          .eq("vandut", false)
          .order("created_at", { ascending: true })
          .range(from, to);
        const orFilter = buildSearchOrFilter(
          termenCautare,
          PRODUSE_CAUTARE_COLOANE,
        );
        if (orFilter) produseQuery = produseQuery.or(orFilter);

        const [
          { data: produse, error: prodErr, count },
          { data: profiles, error: profErr },
          { data: asocieri, error: asoErr },
          marci,
        ] = await Promise.all([
          produseQuery,
          getCached("profiles"),
          getCached("agent_magazine"),
          fetchMarciDistincte(),
          loadTvaRate(),
        ]);

        const error =
          (prodErr && "Eroare la încărcarea stocului: " + prodErr.message) ||
          (profErr &&
            "Eroare la încărcarea profilurilor: " + profErr.message) ||
          null;
        if (error) return { error };

        const agenti = (profiles || []).filter((p) => p.role === "agent");
        const magazine = (profiles || []).filter((p) => p.role === "magazin");
        const agentMagazinMap = buildAgentMagazinMap(
          asoErr ? [] : asocieri,
          agenti,
        );

        const produsIds = (produse || []).map((p) => p.id);
        const { data: linii } = produsIds.length
          ? await supa
              .from("comanda_produse")
              .select("produs_id")
              .in("produs_id", produsIds)
              .eq("status_linie", "asignat")
          : { data: [] };
        const reservedIds = new Set((linii || []).map((l) => l.produs_id));

        const tvaProcentCurent = Math.round(TVA_RATE * 10000) / 100;

        return {
          error: null,
          agenti,
          magazine,
          agentMagazinMap,
          marci,
          stocDisponibil: produse || [],
          reservedIds,
          tvaProcentCurent,
          totalCount: count || 0,
        };
      }

      async function renderDepozitCentral(container) {
        container.innerHTML = `<div class="text-sm text-slate-400">Se încarcă...</div>`;

      // Produse trimise: produsele alocate unui magazin sau marcate
      // "vânzare directă", nevândute încă. comenzi/comanda_produse sunt
      // interogate doar pentru produsele din pagina curentă, ca să se poată
      // afișa numărul comenzii de origine lângă produs.
      async function loadProduseTrimiseData(pageKey) {
        const termenCautare = tabSearchTerms[currentTabKey] || "";
        const { from, to } = rangeFor(pageKey);
        let produseQuery = supa
          .from("produse")
          .select("*", { count: "exact" })
          .or("magazin_id.not.is.null,vanzare_directa.eq.true")
          .eq("vandut", false)
          .order("created_at", { ascending: true })
          .range(from, to);
        const orFilter = buildSearchOrFilter(
          termenCautare,
          PRODUSE_CAUTARE_COLOANE,
        );
        if (orFilter) produseQuery = produseQuery.or(orFilter);

        const [
          { data: produse, error: prodErr, count },
          { data: profiles, error: profErr },
          { data: asocieri, error: asoErr },
          marci,
        ] = await Promise.all([
          produseQuery,
          getCached("profiles"),
          getCached("agent_magazine"),
          fetchMarciDistincte(),
        ]);

        const error =
          (prodErr && "Eroare la încărcarea stocului: " + prodErr.message) ||
          (profErr &&
            "Eroare la încărcarea profilurilor: " + profErr.message) ||
          null;
        if (error) return { error };

        const agenti = (profiles || []).filter((p) => p.role === "agent");
        const magazine = (profiles || []).filter((p) => p.role === "magazin");
        const agentMagazinMap = buildAgentMagazinMap(
          asoErr ? [] : asocieri,
          agenti,
        );

        const produsIds = (produse || []).map((p) => p.id);
        const { data: liniiProduse } = produsIds.length
          ? await supa
              .from("comanda_produse")
              .select("*")
              .in("produs_id", produsIds)
              .eq("status_linie", "trimis")
          : { data: [] };
        const comandaIds = Array.from(
          new Set(
            (liniiProduse || []).map((l) => l.comanda_id).filter(Boolean),
          ),
        );
        // Se reia comanda_produse, de data asta după comanda_id (nu produs_id),
        // ca modalul "comandă inițială" să arate TOATE liniile comenzii —
        // nu doar linia produsului aflat în pagina curentă.
        const [{ data: linii }, { data: comenzi }] = comandaIds.length
          ? await Promise.all([
              supa
                .from("comanda_produse")
                .select("*")
                .in("comanda_id", comandaIds),
              supa.from("comenzi").select("*").in("id", comandaIds),
            ])
          : [{ data: [] }, { data: [] }];

        const produsComandaMap = buildProdusComandaMap(liniiProduse, comenzi);
        const comandaCtx = {
          map: produsComandaMap,
          linii: linii || [],
          profiles: profiles || [],
        };

        return {
          error: null,
          agenti,
          magazine,
          agentMagazinMap,
          marci,
          produseTrimise: produse || [],
          comandaCtx,
          totalCount: count || 0,
        };
      }

      async function renderProduseTrimiseTab(container) {
        container.innerHTML = `<div class="text-sm text-slate-400">Se încarcă...</div>`;
        const myGen = renderGen;
        const pageKey = currentTabKey;

        if (d.error) {

      function bindProductRow(
        p,
        agenti,
        magazine,
        agentMagazinMap,
        marci,
        refresh,
        comandaCtx,
        isReserved,
      ) {
        const row = document.querySelector(`tr[data-prow="${p.id}"]`);
        if (!row) return;

        row.querySelector(".produs-id-link").addEventListener("click", () => {
          const poateVanzareDirecta =
            !isReserved && !p.magazin_id && !p.vanzare_directa && !p.vandut;
          renderEditProductModal(
            p,
            agenti,
            magazine,
            refresh,
            marci,
            poateVanzareDirecta,
          );
        });

        const comandaLink = row.querySelector(".comanda-produs-link");
        if (comandaLink && comandaCtx) {
          comandaLink.addEventListener("click", () => {
            const comanda = comandaCtx.map.get(p.id);
            if (comanda) {
              deschideComandaInitiala(
                comanda,
                comandaCtx.linii,
                comandaCtx.profiles,
              );
            }
          });
        }

        const agentInput = row.querySelector(".agent-input");
        attachAgentAutocomplete(
          agentInput,
          row.querySelector(".agent-suggestions"),
          agenti.map((a) => a.nume || a.email),
        );

        attachAgentAutocomplete(
          row.querySelector(".marca-input"),
          row.querySelector(".marca-suggestions"),
          marci,
        );

        const catSelect = row.querySelector(".categorie-select");
        const catAltaWrap = row.querySelector(".categorie-alta-wrap");
        const catAlta = row.querySelector(".categorie-alta-input");
        catSelect.addEventListener("change", () => {
          if (catSelect.value === "__alta__") {
            catSelect.classList.add("hidden");
            catAltaWrap.classList.remove("hidden");
            catAlta.value = "";
            catAlta.focus();
          }
        });
        row
          .querySelector(".categorie-alta-back")
          .addEventListener("click", () => {
            catAltaWrap.classList.add("hidden");
            catSelect.classList.remove("hidden");
            catSelect.value = "";
            catAlta.value = "";
          });

        const intrareInput = row.querySelector('[data-field="pret_intrare"]');
        const vanzareInput = row.querySelector('[data-field="pret_vanzare"]');
        const alteInput = row.querySelector('[data-field="alte_costuri"]');
        const adaosInput = row.querySelector(".adaos-input");
        const totalInput = row.querySelector(".total-input");
        const tvaInput = row.querySelector(".tva-input");
        attachPriceAutoCalc({
          intrareInput,
          vanzareInput,
          adaosInput,
          alteInput,
          totalInput,
          tvaInput,
        });

        const magazinInput = row.querySelector(".magazin-input");
        const magazinIdInput = row.querySelector(".magazin-id-input");
        const telefonCell = row.querySelector(".telefon-cell");
        const adresaCell = row.querySelector(".adresa-cell");
        attachMagazinAutocomplete(
          magazinInput,
          row.querySelector(".magazin-suggestions"),
          magazinIdInput,
          magazine,
          (m) => {
            telefonCell.textContent = m ? m.telefon || "—" : "—";
            adresaCell.textContent = m ? m.adresa_facturare || "—" : "—";
            adresaCell.title = m ? m.adresa_facturare || "" : "";

            if (m && agentMagazinMap.has(m.id)) {
              agentInput.value = agentMagazinMap.get(m.id);
            }
          },
        );

        row
          .querySelector(".save-produs-btn")
          .addEventListener("click", async () => {
            const btn = row.querySelector(".save-produs-btn");
            btn.disabled = true;
            btn.textContent = "Se salvează...";

            const agentVal =
              row.querySelector('[data-field="agent"]').value.trim() || null;
            const categorieVal = !catAltaWrap.classList.contains("hidden")
              ? catAlta.value.trim() || null
              : catSelect.value || null;
            const intrare = parseFloat(intrareInput.value) || null;
            const vanzare = parseFloat(vanzareInput.value) || null;
            const alte = parseFloat(alteInput.value) || 0;
            const adaos = adaosInput.value.trim()
              ? parseFloat(adaosInput.value)
              : null;
            const total = totalInput.value.trim()
              ? parseFloat(totalInput.value)
              : null;
            const cuTva = tvaInput.value.trim()
              ? parseFloat(tvaInput.value)
              : null;
            const pretRecomandatCell = row.querySelector(
              '[data-field="pret_recomandat"]',
            );
            const pretRecomandat = pretRecomandatCell.value.trim()
              ? parseFloat(pretRecomandatCell.value)
              : null;
            const magazinId = magazinIdInput.value || null;
            const magazinInputVal = magazinInput.value.trim();
            const magazinProfil = magazine.find((m) => m.id === magazinId);

            const campMagazinGolit = !magazinId && !magazinInputVal;

            const magazinSchimbat =
              magazinId !== (p.magazin_id || null) ||
              (!!p.vanzare_directa && campMagazinGolit);

            const eraTrimis = !!(p.magazin_id || p.vanzare_directa);
            const esteRetragere = campMagazinGolit && eraTrimis;

            const payload = {
              agent: esteRetragere ? null : agentVal,
              categorie: categorieVal,
              marca:
                row.querySelector('[data-field="marca"]').value.trim() || null,
              culoare:
                row.querySelector('[data-field="culoare"]').value.trim() ||
                null,
              vin: row.querySelector('[data-field="vin"]').value.trim() || null,
              pret_intrare: intrare,
              pret_vanzare: vanzare,
              adaos,
              alte_costuri: alte,
              total_fara_tva: total,
              pret_cu_tva: cuTva,
              pret_recomandat: pretRecomandat,
              magazin_id: magazinId,
              telefon: esteRetragere
                ? null
                : magazinProfil
                  ? magazinProfil.telefon || null
                  : p.telefon || null,
              adresa_facturare: esteRetragere
                ? null
                : magazinProfil
                  ? magazinProfil.adresa_facturare || null
                  : p.adresa_facturare || null,
              updated_at: new Date().toISOString(),
            };

            if (magazinSchimbat) {
              payload.vanzare_directa = false;
            }
            if (esteRetragere) {
              payload.data_comenzii = null;
            } else if (magazinId && magazinSchimbat) {
              payload.data_comenzii = new Date().toISOString().slice(0, 10);
            }

            const { error } = await supa
              .from("produse")
              .update(payload)
              .eq("id", p.id);

            if (error) {
              btn.disabled = false;
              btn.textContent = "Salvează";
              toast("Eroare: " + error.message, true);
              return;
            }

            if (esteRetragere) {
              const { data: liniiRealocate } = await supa
                .from("comanda_produse")
                .update({ status_linie: "realocat" })
                .eq("produs_id", p.id)
                .eq("status_linie", "trimis")
                .select();
              const comenziAfectate = new Set(
                (liniiRealocate || []).map((l) => l.comanda_id),
              );
              for (const comandaId of comenziAfectate) {
                const { data: toateLiniile } = await supa
                  .from("comanda_produse")
                  .select("status_linie")
                  .eq("comanda_id", comandaId);
                await supa
                  .from("comenzi")
                  .update({
                    status: computeComandaStatus(toateLiniile || []),
                    updated_at: new Date().toISOString(),
                  })
                  .eq("id", comandaId);
              }
            }

            btn.disabled = false;
            btn.textContent = "Salvează";

            Object.assign(p, payload);
            toast("Produs salvat cu succes.");
            if (magazinSchimbat) {
              refresh();
              return;
            }
            if (payload.data_comenzii) {
              row.querySelector(".data-comenzii-cell").textContent = new Date(
                payload.data_comenzii,
              ).toLocaleDateString("ro-RO");
            }
          });

        row
          .querySelector(".delete-produs-btn")
          .addEventListener("click", async () => {
            const ok = confirm(
              `Ștergi definitiv produsul ${p.id_produs}? Acțiunea nu poate fi anulată.`,
            );
            if (!ok) return;
            const btn = row.querySelector(".delete-produs-btn");
            btn.disabled = true;
            btn.textContent = "Se șterge...";
            const { error } = await supa
              .from("produse")
              .delete()
              .eq("id", p.id);
            if (error) {
              toast("Eroare la ștergere: " + error.message, true);
              btn.disabled = false;
              btn.textContent = "Șterge";
              return;
            }
            toast("Produs șters din stoc.");
            row.remove();
          });
      }

      function statusBadge(status) {

      const COMANDA_FILTER_STATUSES = [
        { key: "in_asteptare", label: "În așteptare" },
        { key: "partial_onorata", label: "Parțial onorată" },
        { key: "onorata", label: "Onorată" },
      ];
      let comenziStatusFilter = [];
      let bateriiFiltruActiv = "toate";

      function statusFilterChipsHtml(selected) {
        const chip = (key, label, active) =>
          `<button type="button" data-status-filter="${key}" class="status-filter-chip rounded-full px-3 py-1 text-xs font-medium border transition-colors ${active ? "bg-slate-800 text-white border-slate-800" : "border-slate-300 text-slate-600 hover:bg-slate-50"}">${esc(label)}</button>`;
        return `
    <div class="flex items-center gap-1.5 flex-wrap mb-3">
      <span class="text-xs text-slate-400 mr-1">Filtru status:</span>
      ${chip("__all__", "Toate", !selected.length)}
      ${COMANDA_FILTER_STATUSES.map((s) => chip(s.key, s.label, selected.includes(s.key))).join("")}
    </div>`;
      }

      function bindStatusFilterChips(container, onChange) {
        container.querySelectorAll(".status-filter-chip").forEach((btn) => {
          btn.addEventListener("click", () => {
            const key = btn.dataset.statusFilter;
            if (key === "__all__") {
              comenziStatusFilter = [];
              onChange();
              return;
            }
            const next = comenziStatusFilter.slice();
            const idx = next.indexOf(key);
            if (idx >= 0) {
              next.splice(idx, 1);
            } else {
              if (next.length >= 2) next.shift();
              next.push(key);
            }
            comenziStatusFilter = next;
            onChange();
          });
        });
      }

      function comandaStatusFiltrabil(c, lines) {
        return c.status === "anulata" ? "anulata" : computeComandaStatus(lines);
      }

      function filtreazaComenziDupaStatus(comenzi, linii) {
        if (!comenziStatusFilter.length) return comenzi;
        return comenzi.filter((c) => {
          const st = comandaStatusFiltrabil(
            c,
            linii.filter((l) => l.comanda_id === c.id),
          );
          return comenziStatusFilter.includes(st);
        });
      }

      function lineStatusLabel(s) {
        if (s === "trimis") return "Trimis";
        if (s === "realocat") return "Realocat";
        if (s === "asignat") return "Pregătit (rezervat)";
        return "Neasignat";
      }

      function produsMatchesLinie(p, l) {
        if (l.categorie && p.categorie !== l.categorie) return false;
        if (
          l.marca &&
          (p.marca || "").trim().toLowerCase() !==
            (l.marca || "").trim().toLowerCase()
        )
          return false;
        if (
          l.culoare &&
          (p.culoare || "").trim().toLowerCase() !==
            (l.culoare || "").trim().toLowerCase()
        )
          return false;
        return true;
      }

      // Stoc central disponibil + rezervări "asignat" — folosit la
      // crearea/revizuirea comenzilor (context.produse / context.allLinii).
      // Interoghează doar candidații reali (stoc central nealocat, nevândut,
      // fără vânzare directă) și liniile de comandă încă "asignat" (nu
      // "trimis" — acelea au deja magazin_id pe produs și sunt oricum
      // excluse de filtrul de mai jos), nu întregul istoric de produse/linii.
      async function loadStocDisponibilPentruComenzi() {
        const [
          { data: produse, error: prodErr },
          { data: linii, error: liniiErr },
        ] = await Promise.all([
          supa
            .from("produse")
            .select("*")
            .is("magazin_id", null)
            .eq("vandut", false)
            .eq("vanzare_directa", false),
          supa
            .from("comanda_produse")
            .select("*")
            .eq("status_linie", "asignat"),
        ]);
        return {
          produse: prodErr ? [] : produse || [],
          allLinii: liniiErr ? [] : linii || [],
        };
      }

      function stocDisponibilPentruComenzi(context, excludeLinieId) {
        const reserved = new Set(
          (context.allLinii || [])
            .filter((x) => x.produs_id && x.id !== excludeLinieId)
            .map((x) => x.produs_id),
        );
        return (context.produse || []).filter(
          (p) =>
            !p.magazin_id &&
            !p.vandut &&
            !p.vanzare_directa &&
            !reserved.has(p.id),
        );
      }

      function findMatchingStockProduct(l, context) {
        if (l.produs_id) return null;
        const disponibile = stocDisponibilPentruComenzi(context, l.id);
        return disponibile.find((p) => produsMatchesLinie(p, l)) || null;
      }

      function computeComandaStatus(lines) {
        if (!lines.length) return "in_asteptare";
        const allTrimis = lines.every((l) => l.status_linie === "trimis");
        const anyTrimis = lines.some((l) => l.status_linie === "trimis");
        if (allTrimis) return "onorata";
        if (anyTrimis) return "partial_onorata";
        return "in_asteptare";
      }

      async function nextOrderNumber() {
        const sufixAn = String(new Date().getFullYear()).slice(-2);
        const prefix = `C${sufixAn}-`;
        const { data } = await supa.from("comenzi").select("numar_comanda");
        let max = 0;
        (data || []).forEach((c) => {
          const numar = c.numar_comanda || "";
          if (!numar.startsWith(prefix)) return;
          const m = new RegExp(`^${prefix}(\\d+)$`).exec(numar);
          if (m) max = Math.max(max, parseInt(m[1], 10));
        });
        return prefix + String(max + 1).padStart(4, "0");
      }

      async function insertComandaCuNumarUnic(
        payloadFaraNumar,
        maxIncercari = 5,
      ) {
        let ultimaEroare = null;
        for (let incercare = 0; incercare < maxIncercari; incercare++) {
          const numarComanda = await nextOrderNumber();
          const { data, error } = await supa
            .from("comenzi")
            .insert({ ...payloadFaraNumar, numar_comanda: numarComanda })
            .select()
            .single();
          if (!error) {
            return { data, error: null, numarComanda };
          }
          ultimaEroare = error;
          const esteDuplicatNumarComanda =
            error.code === "23505" && /numar_comanda/.test(error.message || "");
          if (!esteDuplicatNumarComanda) {
            return { data: null, error, numarComanda: null };
          }
        }
        return { data: null, error: ultimaEroare, numarComanda: null };
      }

      function renderComandaLinesEditor(
        containerEl,
        marci,
        marcaCategorieMap,
        autoAddFirstRow,
      ) {
        marcaCategorieMap = marcaCategorieMap || {};
        if (autoAddFirstRow === undefined) autoAddFirstRow = true;
        let lineCount = 0;
        function addLineRow() {
          lineCount++;
          const div = document.createElement("div");
          div.className =
            "comanda-line-row grid grid-cols-12 gap-2 items-start border rounded-lg p-2";
          div.style.borderColor = "var(--line)";
          const categorieOptions = CATEGORII_PRODUS.map(
            (c) => `<option value="${esc(c)}">${esc(c)}</option>`,
          ).join("");
          div.innerHTML = `
      <div class="col-span-3">
        <select class="line-categorie ${inputBase()} text-xs">
          <option value="">Categorie...</option>
          ${categorieOptions}
          <option value="__alta__">Altă categorie</option>
        </select>
        <div class="line-categorie-alta-wrap hidden flex items-center gap-1 mt-1">
          <input type="text" class="line-categorie-alta ${inputBase()} text-xs" placeholder="Specifică">
          <button type="button" class="line-categorie-alta-back text-slate-400 hover:text-slate-600 text-xs shrink-0" title="Alege din listă">↺</button>
        </div>
      </div>
      <div class="col-span-3 relative">
        <input type="text" class="line-marca ${inputBase()} text-xs" placeholder="Marcă" autocomplete="off">
        <div class="line-marca-suggestions agent-suggestions hidden absolute z-10 left-0 right-0 mt-1 bg-white border rounded-lg shadow-lg max-h-32 overflow-y-auto text-xs" style="border-color:var(--line)"></div>
      </div>
      <div class="col-span-3"><input type="text" class="line-culoare ${inputBase()} text-xs" placeholder="Culoare"></div>
      <div class="col-span-2">
        <label class="text-[10px] text-slate-400 block mb-0.5 leading-none">Cantitate</label>
        <input type="number" min="1" value="1" class="line-cantitate ${inputBase()} text-xs px-2 text-center">
      </div>
      <div class="col-span-1 flex justify-end pt-4"><button type="button" class="line-remove text-red-500 hover:text-red-700 text-sm" title="Șterge linia">✕</button></div>`;
          containerEl.appendChild(div);

          const catSelect = div.querySelector(".line-categorie");
          const catAltaWrap = div.querySelector(".line-categorie-alta-wrap");
          const catAlta = div.querySelector(".line-categorie-alta");
          catSelect.addEventListener("change", () => {
            if (catSelect.value === "__alta__") {
              catSelect.classList.add("hidden");
              catAltaWrap.classList.remove("hidden");
              catAlta.value = "";
              catAlta.focus();
            }
          });
          div
            .querySelector(".line-categorie-alta-back")
            .addEventListener("click", () => {
              catAltaWrap.classList.add("hidden");
              catSelect.classList.remove("hidden");
              catSelect.value = "";
              catAlta.value = "";
            });
          attachAgentAutocomplete(
            div.querySelector(".line-marca"),
            div.querySelector(".line-marca-suggestions"),
            marci || [],
            (marcaVal) => {
              const catAlreadySet =
                (!catAltaWrap.classList.contains("hidden") &&
                  catAlta.value.trim()) ||
                (catAltaWrap.classList.contains("hidden") && catSelect.value);
              if (catAlreadySet) return;
              const mapped =
                marcaCategorieMap[(marcaVal || "").trim().toLowerCase()];
              if (!mapped) return;
              if (CATEGORII_PRODUS.includes(mapped)) {
                catSelect.value = mapped;
              } else {
                catSelect.classList.add("hidden");
                catAltaWrap.classList.remove("hidden");
                catAlta.value = mapped;
              }
            },
          );
          div.querySelector(".line-remove").addEventListener("click", () => {
            div.remove();
          });
          return div;
        }
        if (autoAddFirstRow) addLineRow();
        return {
          addLineRow,
          fillLineFromProdus(div, p) {
            if (!div || !p) return;
            const catSelect = div.querySelector(".line-categorie");
            const catAltaWrap = div.querySelector(".line-categorie-alta-wrap");
            const catAlta = div.querySelector(".line-categorie-alta");
            if (p.categorie && CATEGORII_PRODUS.includes(p.categorie)) {
              catAltaWrap.classList.add("hidden");
              catSelect.classList.remove("hidden");
              catSelect.value = p.categorie;
            } else if (p.categorie) {
              catSelect.classList.add("hidden");
              catAltaWrap.classList.remove("hidden");
              catAlta.value = p.categorie;
            }
            div.querySelector(".line-marca").value = p.marca || "";
            div.querySelector(".line-culoare").value = p.culoare || "";
          },
          getLines() {
            return Array.from(containerEl.querySelectorAll(".comanda-line-row"))
              .map((div) => {
                const catSelect = div.querySelector(".line-categorie");
                const catAltaWrap = div.querySelector(
                  ".line-categorie-alta-wrap",
                );
                const catAlta = div.querySelector(".line-categorie-alta");
                const categorie = !catAltaWrap.classList.contains("hidden")
                  ? catAlta.value.trim()
                  : catSelect.value;
                return {
                  categorie: categorie || null,
                  marca: div.querySelector(".line-marca").value.trim() || null,
                  culoare:
                    div.querySelector(".line-culoare").value.trim() || null,
                  cantitate:
                    parseInt(div.querySelector(".line-cantitate").value, 10) ||
                    1,
                };
              })
              .filter((l) => l.categorie || l.marca || l.culoare);
          },
        };
      }

              </select>
            </div>

                ? `<div>
              ${fieldLabel("Agent")}
              <div class="relative">
                <input type="text" id="comanda-agent" class="${inputBase()}" placeholder="Caută sau scrie numele agentului" autocomplete="off">
                <div id="comanda-agent-suggestions" class="agent-suggestions hidden absolute z-10 left-0 right-0 mt-1 bg-white border rounded-lg shadow-lg max-h-40 overflow-y-auto text-sm" style="border-color:var(--line)"></div>
              </div>
            </div>`
                : ""
            }
          </div>
          <div>
            ${fieldLabel("Produse cerute")}
            <div id="comanda-lines" class="space-y-2"></div>

          <div class="max-w-[10rem]">

            <input type="number" id="comanda-termen-plata" min="0" step="1" class="${inputBase()}" placeholder="ex: 30">

            <button type="button" id="comanda-cancel" class="flex-1 rounded-lg py-2.5 text-sm font-medium border" style="border-color:var(--line)">Anulează</button>
            <button type="submit" class="flex-1 btn-primary rounded-lg py-2.5 text-sm">Trimite comanda</button>
          </div>
          <p id="comanda-msg" class="text-sm text-center"></p>
        </form>
        <button type="button" id="comanda-vezi-stoc" class="mt-3 text-xs font-medium underline block" style="color:var(--teal-dark)">Vezi disponibilitate în stocul central</button>
      </div>
      <div id="comanda-stoc-central-wrap" class="hidden bg-white rounded-2xl shadow-xl p-4 w-full max-w-sm fade-in flex flex-col shrink-0">
        <p class="text-sm font-semibold text-slate-700 mb-2">Disponibil în stocul central</p>
        <input type="text" id="comanda-stoc-central-search" class="${inputBase()} mb-2 text-xs" placeholder="Caută categorie, marcă, culoare...">
        <div class="grid grid-cols-2 gap-2 mb-2">
          <input type="text" id="comanda-stoc-central-filtru-marca" class="${inputBase()} text-xs" placeholder="Filtrează după marcă">
          <input type="text" id="comanda-stoc-central-filtru-culoare" class="${inputBase()} text-xs" placeholder="Filtrează după culoare">

        document.body.appendChild(overlay);

        document
          .getElementById("comanda-cancel")
          .addEventListener("click", () => overlay.remove());
        document
          .getElementById("comanda-close-x")
          .addEventListener("click", () => overlay.remove());
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) overlay.remove();
        });

        if (mode === "admin") {
          attachAgentAutocomplete(
            document.getElementById("comanda-agent"),
            document.getElementById("comanda-agent-suggestions"),
            context.agenti.map((a) => a.nume || a.email),
          );
        }

        const linesContainer = document.getElementById("comanda-lines");
        const editor = renderComandaLinesEditor(
          linesContainer,
          context.marci,
          context.marcaCategorieMap,
          false,
        );
        document
          .getElementById("comanda-add-line")
          .addEventListener("click", () => editor.addLineRow());

        const stocDisponibilComanda = stocDisponibilPentruComenzi(
          { produse: context.produse || [], allLinii: context.allLinii || [] },
          null,
        );
        const veziStocBtn = document.getElementById("comanda-vezi-stoc");
        const stocWrap = document.getElementById("comanda-stoc-central-wrap");
        const stocList = document.getElementById("comanda-stoc-central-list");
        function paintStocCentral(filterQ, filtruMarca, filtruCuloare) {
          const q = (filterQ || "").trim().toLowerCase();
          const fm = (filtruMarca || "").trim().toLowerCase();
          const fc = (filtruCuloare || "").trim().toLowerCase();
          let filtered = !q
            ? stocDisponibilComanda
            : stocDisponibilComanda.filter((p) =>
                [p.categorie, p.marca, p.culoare]
                  .filter(Boolean)
                  .some((v) => v.toLowerCase().includes(q)),
              );
          if (fm)
            filtered = filtered.filter((p) =>
              (p.marca || "").toLowerCase().includes(fm),
            );
          if (fc)
            filtered = filtered.filter((p) =>
              (p.culoare || "").toLowerCase().includes(fc),
            );
          stocList.innerHTML = filtered.length
            ? filtered
                .map(
                  (p) => `
        <button type="button" data-stoc-produs="${p.id}" class="w-full text-left border rounded-md px-2.5 py-1.5 text-xs hover:bg-slate-50 flex items-center justify-between gap-2" style="border-color:var(--line)">
          <span>${esc(p.categorie || "—")} · ${esc(p.marca || "—")} · ${esc(p.culoare || "—")} · C.I.V.: ${p.civ ? "Da" : "Nu"}</span>
          <span class="font-semibold whitespace-nowrap">${p.pret_cu_tva !== null && p.pret_cu_tva !== undefined ? fmtNum(p.pret_cu_tva) + " lei" : "—"}</span>
        </button>`,
                )
                .join("")
            : `<p class="text-xs text-slate-400 text-center py-3">Niciun produs disponibil în stoc.</p>`;
          stocList.querySelectorAll("[data-stoc-produs]").forEach((btn) => {
            btn.addEventListener("click", () => {
              const p = stocDisponibilComanda.find(
                (x) => x.id === btn.dataset.stocProdus,
              );
              if (!p) return;
              const row = editor.addLineRow();
              editor.fillLineFromProdus(row, p);
            });
          });
        }
        function repaintStocCentral() {
          paintStocCentral(
            document.getElementById("comanda-stoc-central-search").value,
            document.getElementById("comanda-stoc-central-filtru-marca").value,
            document.getElementById("comanda-stoc-central-filtru-culoare")
              .value,
          );
        }
        if (veziStocBtn) {
          veziStocBtn.addEventListener("click", () => {
            const wasHidden = stocWrap.classList.contains("hidden");
            if (wasHidden) {
              const card = document.getElementById("comanda-nou-card");
              stocWrap.style.maxHeight = card.offsetHeight + "px";
              stocWrap.classList.remove("hidden");
              repaintStocCentral();
            } else {
              stocWrap.classList.add("hidden");
            }
          });
          document
            .getElementById("comanda-stoc-central-search")
            .addEventListener("input", repaintStocCentral);
          document
            .getElementById("comanda-stoc-central-filtru-marca")
            .addEventListener("input", repaintStocCentral);
          document
            .getElementById("comanda-stoc-central-filtru-culoare")
            .addEventListener("input", repaintStocCentral);
        }

        document
          .getElementById("form-new-comanda")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const msg = document.getElementById("comanda-msg");
            const btn = e.target.querySelector('button[type="submit"]');

            const magazinId = document.getElementById("comanda-magazin").value;
            if (!magazinId) {
              msg.className = "text-sm text-center text-red-600";
              msg.textContent = "Alege magazinul pentru care se face comanda.";
              return;
            }
            const lines = editor.getLines();
            if (!lines.length) {
              msg.className = "text-sm text-center text-red-600";
              msg.textContent = "Adaugă cel puțin un produs în comandă.";
              return;
            }

            const agentVal =
              mode === "admin"
                ? document.getElementById("comanda-agent").value.trim() || null
                : currentProfile.nume || currentProfile.email;

            btn.disabled = true;
            btn.textContent = "Se trimite...";

            const esteVanzareDirecta =
              mode === "admin" && magazinId === VANZARE_DIRECTA;
            const termenPlataVal = document
              .getElementById("comanda-termen-plata")
              .value.trim();
            const numarComandaPayload = {
              magazin_id: esteVanzareDirecta ? null : magazinId,
              vanzare_directa: esteVanzareDirecta,
              agent: agentVal,
              creat_de: currentUser.id,
              status: "in_asteptare",
              termen_plata: termenPlataVal
                ? parseInt(termenPlataVal, 10)
                : null,
              observatii:
                document.getElementById("comanda-observatii").value.trim() ||
                null,
            };
            const {
              data: comanda,
              error: comErr,
              numarComanda,
            } = await insertComandaCuNumarUnic(numarComandaPayload);

            if (comErr) {
              msg.className = "text-sm text-center text-red-600";
              msg.textContent = comErr.message;
              btn.disabled = false;
              btn.textContent = "Trimite comanda";
              return;
            }

            const { error: liniiErr } = await supa
              .from("comanda_produse")
              .insert(
                lines.flatMap((l) =>
                  Array.from({ length: l.cantitate }, () => ({
                    comanda_id: comanda.id,
                    categorie: l.categorie,
                    marca: l.marca,
                    culoare: l.culoare,
                    cantitate: 1,
                    status_linie: "neasignat",
                  })),
                ),
              );

            if (liniiErr) {
              msg.className = "text-sm text-center text-red-600";
              msg.textContent = liniiErr.message;
              btn.disabled = false;
              btn.textContent = "Trimite comanda";
              return;
            }

            overlay.remove();
            toast(`Comanda ${numarComanda} a fost creată.`);
            onSaved();
          });
      }

        <div class="font-medium">${esc(p.categorie || "—")} · ${esc(p.marca || "—")} · ${esc(p.culoare || "—")}</div>
